          package vn.amlich.app

          import android.content.Context

          data class Settings(
              val numberSp: Int = 48,
              val monthSp: Int = 14,
              val dateSp: Int = 13,
              val calScale: Int = 100,
              val numberColor: Int = 0xFFE53935.toInt(),
              val textColor: Int = 0xFF212121.toInt(),
              val subColor: Int = 0xFF757575.toInt(),
              val eventColor: Int = 0xFFEF6C00.toInt(),
              val bgColor: Int = 0xFFFFFFFF.toInt(),
              val bgAlpha: Int = 96,
              val showYear: Boolean = true,
              val showEvent: Boolean = true
          )

          object Prefs {
              private const val FILE = "amlich_prefs"

              fun load(ctx: Context): Settings {
                  val p = ctx.getSharedPreferences(FILE, Context.MODE_PRIVATE)
                  val d = Settings()
                  return Settings(
                      numberSp = p.getInt("numberSp", d.numberSp),
                      monthSp = p.getInt("monthSp", d.monthSp),
                      dateSp = p.getInt("dateSp", d.dateSp),
                      calScale = p.getInt("calScale", d.calScale),
                      numberColor = p.getInt("numberColor", d.numberColor),
                      textColor = p.getInt("textColor", d.textColor),
                      subColor = p.getInt("subColor", d.subColor),
                      eventColor = p.getInt("eventColor", d.eventColor),
                      bgColor = p.getInt("bgColor", d.bgColor),
                      bgAlpha = p.getInt("bgAlpha", d.bgAlpha),
                      showYear = p.getBoolean("showYear", d.showYear),
                      showEvent = p.getBoolean("showEvent", d.showEvent)
                  )
              }

              fun save(ctx: Context, s: Settings) {
                  ctx.getSharedPreferences(FILE, Context.MODE_PRIVATE).edit()
                      .putInt("numberSp", s.numberSp)
                      .putInt("monthSp", s.monthSp)
                      .putInt("dateSp", s.dateSp)
                      .putInt("calScale", s.calScale)
                      .putInt("numberColor", s.numberColor)
                      .putInt("textColor", s.textColor)
                      .putInt("subColor", s.subColor)
                      .putInt("eventColor", s.eventColor)
                      .putInt("bgColor", s.bgColor)
                      .putInt("bgAlpha", s.bgAlpha)
                      .putBoolean("showYear", s.showYear)
                      .putBoolean("showEvent", s.showEvent)
                      .apply()
              }

              fun reset(ctx: Context) {
                  ctx.getSharedPreferences(FILE, Context.MODE_PRIVATE).edit().clear().apply()
              }
          }

          cat > "app/src/main/java/vn/amlich/app/WidgetUpdater.kt" <<'AMLICH_EOF'
          package vn.amlich.app

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.RectF
          import android.util.TypedValue
          import android.view.View
          import android.widget.RemoteViews
          import java.util.Calendar

          object WidgetUpdater {
              const val ACTION_REFRESH = "vn.amlich.app.REFRESH"

              fun updateAll(ctx: Context) {
                  val mgr = AppWidgetManager.getInstance(ctx)
                  for (id in mgr.getAppWidgetIds(ComponentName(ctx, DayWidgetProvider::class.java))) {
                      updateDay(ctx, mgr, id)
                  }
                  for (id in mgr.getAppWidgetIds(ComponentName(ctx, MonthWidgetProvider::class.java))) {
                      updateMonth(ctx, mgr, id)
                  }
                  scheduleMidnight(ctx)
              }

              private fun openAppIntent(ctx: Context): PendingIntent {
                  val i = Intent(ctx, MainActivity::class.java)
                  return PendingIntent.getActivity(ctx, 0, i, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
              }

              /** Kích thước widget hiện tại theo dp (chiều dọc). */
              private fun sizeOf(mgr: AppWidgetManager, id: Int, defW: Float, defH: Float): Pair<Float, Float> {
                  val o = mgr.getAppWidgetOptions(id)
                  val w = o.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH, 0)
                  val h = o.getInt(AppWidgetManager.OPTION_APPWIDGET_MAX_HEIGHT, 0)
                  return Pair(if (w > 0) w.toFloat() else defW, if (h > 0) h.toFloat() else defH)
              }

              fun updateDay(ctx: Context, mgr: AppWidgetManager, id: Int) {
                  val (w, h) = sizeOf(mgr, id, 110f, 110f)
                  mgr.updateAppWidget(id, buildDay(ctx, w, h))
              }

              fun updateMonth(ctx: Context, mgr: AppWidgetManager, id: Int) {
                  val (w, h) = sizeOf(mgr, id, 250f, 250f)
                  mgr.updateAppWidget(id, buildMonth(ctx, w, h))
              }

              private fun bgBitmap(ctx: Context, wDp: Float, hDp: Float, s: Settings): Bitmap {
                  val dens = ctx.resources.displayMetrics.density
                  var wp = (wDp * dens).toInt().coerceAtLeast(40)
                  var hp = (hDp * dens).toInt().coerceAtLeast(40)
                  val m = maxOf(wp, hp)
                  if (m > 800) {
                      val k = 800f / m
                      wp = (wp * k).toInt().coerceAtLeast(40)
                      hp = (hp * k).toInt().coerceAtLeast(40)
                  }
                  val bmp = Bitmap.createBitmap(wp, hp, Bitmap.Config.ARGB_8888)
                  val c = Canvas(bmp)
                  val paint = Paint(Paint.ANTI_ALIAS_FLAG)
                  val a = (s.bgAlpha.coerceIn(0, 100) * 255 / 100)
                  paint.color = (s.bgColor and 0x00FFFFFF) or (a shl 24)
                  val r = 22f * (wp / wDp)
                  c.drawRoundRect(RectF(0f, 0f, wp.toFloat(), hp.toFloat()), r, r, paint)
                  return bmp
              }

              fun buildDay(ctx: Context, wDp: Float, hDp: Float): RemoteViews {
                  val s = Prefs.load(ctx)
                  val dens = ctx.resources.displayMetrics.density
                  val c = Calendar.getInstance()
                  val d = c.get(Calendar.DAY_OF_MONTH)
                  val m = c.get(Calendar.MONTH) + 1
                  val y = c.get(Calendar.YEAR)
                  val l = LunarCalendar.toLunar(d, m, y)
                  val sc = (minOf(wDp, hDp) / 110f).coerceIn(0.5f, 1.7f)

                  val rv = RemoteViews(ctx.packageName, R.layout.widget_day)
                  rv.setImageViewBitmap(R.id.img_bg, bgBitmap(ctx, wDp, hDp, s))

                  rv.setTextViewText(R.id.tv_dow, LunarCalendar.dowName(d, m, y) + ", " + d + "/" + m)
                  rv.setTextViewText(R.id.tv_lunar_day, l.day.toString())
                  rv.setTextViewText(R.id.tv_lunar_month, LunarCalendar.lunarMonthLabel(l) + " âm lịch")
                  rv.setTextViewText(R.id.tv_year, "Năm " + LunarCalendar.yearName(l.year))
                  rv.setTextViewText(
                      R.id.tv_event,
                      LunarCalendar.eventOf(d, m, l).ifEmpty { "Ngày " + LunarCalendar.dayName(d, m, y) }
                  )

                  rv.setTextViewTextSize(R.id.tv_dow, TypedValue.COMPLEX_UNIT_SP, s.dateSp * sc)
                  rv.setTextViewTextSize(R.id.tv_lunar_day, TypedValue.COMPLEX_UNIT_SP, s.numberSp * sc)
                  rv.setTextViewTextSize(R.id.tv_lunar_month, TypedValue.COMPLEX_UNIT_SP, s.monthSp * sc)
                  rv.setTextViewTextSize(R.id.tv_year, TypedValue.COMPLEX_UNIT_SP, maxOf(s.monthSp - 2, 7) * sc)
                  rv.setTextViewTextSize(R.id.tv_event, TypedValue.COMPLEX_UNIT_SP, maxOf(s.monthSp - 3, 7) * sc)

                  rv.setTextColor(R.id.tv_dow, s.subColor)
                  rv.setTextColor(R.id.tv_lunar_day, s.numberColor)
                  rv.setTextColor(R.id.tv_lunar_month, s.textColor)
                  rv.setTextColor(R.id.tv_year, s.textColor)
                  rv.setTextColor(R.id.tv_event, s.eventColor)

                  fun vis(show: Boolean) = if (show) View.VISIBLE else View.GONE
                  rv.setViewVisibility(R.id.tv_dow, vis(hDp >= 60f))
                  rv.setViewVisibility(R.id.tv_lunar_month, vis(hDp >= 70f))
                  rv.setViewVisibility(R.id.tv_year, vis(s.showYear && hDp >= 90f))
                  rv.setViewVisibility(R.id.tv_event, vis(s.showEvent && hDp >= 100f))

                  val pad = (6 * dens * sc).toInt()
                  rv.setViewPadding(R.id.ll_content, pad, pad, pad, pad)
                  rv.setOnClickPendingIntent(R.id.widget_root, openAppIntent(ctx))
                  return rv
              }

              fun buildMonth(ctx: Context, wDp: Float, hDp: Float): RemoteViews {
                  val s = Prefs.load(ctx)
                  val c = Calendar.getInstance()
                  val d = c.get(Calendar.DAY_OF_MONTH)
                  val m = c.get(Calendar.MONTH) + 1
                  val y = c.get(Calendar.YEAR)
                  val l = LunarCalendar.toLunar(d, m, y)

                  val bmp = bgBitmap(ctx, wDp, hDp, s)
                  val canvas = Canvas(bmp)
                  val pad = minOf(bmp.width, bmp.height) * 0.03f
                  canvas.translate(pad, pad)
                  val title = "Tháng $m/$y  ·  ${l.day}/${l.month}" + (if (l.leap) " nhuận" else "") + " ÂL"
                  val style = MonthRenderer.Style(s.textColor, s.subColor, s.numberColor, s.eventColor, s.calScale / 100f)
                  MonthRenderer.draw(
                      canvas, bmp.width - 2 * pad, bmp.height - 2 * pad, y, m, y, m, d, 0, title, style
                  )

                  val rv = RemoteViews(ctx.packageName, R.layout.widget_month)
                  rv.setImageViewBitmap(R.id.img_month, bmp)
                  rv.setOnClickPendingIntent(R.id.widget_root, openAppIntent(ctx))
                  return rv
              }

              fun scheduleMidnight(ctx: Context) {
                  val am = ctx.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val i = Intent(ctx, RefreshReceiver::class.java)
                  i.action = ACTION_REFRESH
                  val pi = PendingIntent.getBroadcast(
                      ctx, 1, i, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val next = Calendar.getInstance()
                  next.add(Calendar.DAY_OF_MONTH, 1)
                  next.set(Calendar.HOUR_OF_DAY, 0)
                  next.set(Calendar.MINUTE, 0)
                  next.set(Calendar.SECOND, 30)
                  next.set(Calendar.MILLISECOND, 0)
                  am.setAndAllowWhileIdle(AlarmManager.RTC, next.timeInMillis, pi)
              }
          }
          AMLICH_EOF
          mkdir -p "app/src/main/java/vn/amlich/app"

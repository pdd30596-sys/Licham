          package vn.amlich.app

          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle

          class DayWidgetProvider : AppWidgetProvider() {
              override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                  for (id in appWidgetIds) WidgetUpdater.updateDay(context, appWidgetManager, id)
                  WidgetUpdater.scheduleMidnight(context)
              }

              override fun onAppWidgetOptionsChanged(
                  context: Context, appWidgetManager: AppWidgetManager, appWidgetId: Int, newOptions: Bundle
              ) {
                  WidgetUpdater.updateDay(context, appWidgetManager, appWidgetId)
              }
          }

          class MonthWidgetProvider : AppWidgetProvider() {
              override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                  for (id in appWidgetIds) WidgetUpdater.updateMonth(context, appWidgetManager, id)
                  WidgetUpdater.scheduleMidnight(context)
              }

              override fun onAppWidgetOptionsChanged(
                  context: Context, appWidgetManager: AppWidgetManager, appWidgetId: Int, newOptions: Bundle
              ) {
                  WidgetUpdater.updateMonth(context, appWidgetManager, appWidgetId)
              }
          }

          class RefreshReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  WidgetUpdater.updateAll(context)
              }
          }

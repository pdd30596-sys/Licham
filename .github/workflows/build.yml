          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView

          class SettingsActivity : Activity() {
              private var s = Settings()
              private lateinit var dayBox: FrameLayout
              private lateinit var monthBox: FrameLayout

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private val presets = intArrayOf(
                  0xFFFFFFFF.toInt(), 0xFF000000.toInt(), 0xFF212121.toInt(), 0xFF757575.toInt(), 0xFFBDBDBD.toInt(), 0xFFFFF8E1.toInt(),
                  0xFFE53935.toInt(), 0xFFD81B60.toInt(), 0xFF8E24AA.toInt(), 0xFF3949AB.toInt(), 0xFF1E88E5.toInt(), 0xFF00ACC1.toInt(),
                  0xFF00897B.toInt(), 0xFF43A047.toInt(), 0xFFC0CA33.toInt(), 0xFFFDD835.toInt(), 0xFFFB8C00.toInt(), 0xFF6D4C41.toInt()
              )

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  s = Prefs.load(this)

                  val scroll = ScrollView(this)
                  scroll.setBackgroundColor(0xFFFAFAFA.toInt())
                  scroll.fitsSystemWindows = true
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(dp(16), dp(16), dp(16), dp(24))
                  scroll.addView(root, ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))

                  root.addView(heading("Tùy chỉnh widget", 22f))
                  root.addView(note("Xem trước bên dưới đổi ngay khi bạn chỉnh. Có thể kéo viền widget ở màn hình chính để thu nhỏ hoặc phóng to."))

                  val preview = LinearLayout(this)
                  preview.orientation = LinearLayout.VERTICAL
                  preview.gravity = Gravity.CENTER_HORIZONTAL
                  preview.setBackgroundColor(0xFF90A4AE.toInt())
                  preview.setPadding(dp(12), dp(12), dp(12), dp(12))
                  dayBox = FrameLayout(this)
                  monthBox = FrameLayout(this)
                  preview.addView(dayBox, LinearLayout.LayoutParams(dp(130), dp(130)))
                  val mlp = LinearLayout.LayoutParams(dp(280), dp(250))
                  mlp.topMargin = dp(12)
                  preview.addView(monthBox, mlp)
                  root.addView(preview, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))

                  root.addView(heading("Kích thước chữ", 18f))
                  addSeek(root, "Số ngày âm (widget ngày)", 20, 90, s.numberSp, " sp") { v -> update(s.copy(numberSp = v)) }
                  addSeek(root, "Chữ tháng / năm âm", 8, 26, s.monthSp, " sp") { v -> update(s.copy(monthSp = v)) }
                  addSeek(root, "Chữ ngày dương", 8, 22, s.dateSp, " sp") { v -> update(s.copy(dateSp = v)) }
                  addSeek(root, "Cỡ chữ lịch tháng (widget tháng)", 60, 150, s.calScale, " %") { v -> update(s.copy(calScale = v)) }

                  root.addView(heading("Hiển thị (widget ngày)", 18f))
                  addCheck(root, "Hiện năm can chi", s.showYear) { b -> update(s.copy(showYear = b)) }
                  addCheck(root, "Hiện ngày lễ / ngày can chi", s.showEvent) { b -> update(s.copy(showEvent = b)) }

                  root.addView(heading("Màu sắc", 18f))
                  addColor(root, "Số ngày âm / ngày Chủ nhật", { it.numberColor }) { st, c -> st.copy(numberColor = c) }
                  addColor(root, "Chữ chính (tháng, năm)", { it.textColor }) { st, c -> st.copy(textColor = c) }
                  addColor(root, "Chữ phụ (ngày dương)", { it.subColor }) { st, c -> st.copy(subColor = c) }
                  addColor(root, "Màu ngày lễ", { it.eventColor }) { st, c -> st.copy(eventColor = c) }
                  addColor(root, "Màu nền widget", { it.bgColor }) { st, c -> st.copy(bgColor = c) }
                  addSeek(root, "Độ đậm của nền (0 = trong suốt)", 0, 100, s.bgAlpha, " %") { v -> update(s.copy(bgAlpha = v)) }

                  val reset = Button(this)
                  reset.text = "Khôi phục mặc định"
                  reset.setOnClickListener {
                      Prefs.reset(this)
                      WidgetUpdater.updateAll(this)
                      recreate()
                  }
                  val rlp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  rlp.topMargin = dp(16)
                  root.addView(reset, rlp)

                  setContentView(scroll)
                  refreshPreview()
              }

              override fun onPause() {
                  super.onPause()
                  WidgetUpdater.updateAll(this)
              }

              private fun update(n: Settings) {
                  s = n
                  Prefs.save(this, s)
                  refreshPreview()
              }

              private fun refreshPreview() {
                  dayBox.removeAllViews()
                  monthBox.removeAllViews()
                  val dv = WidgetUpdater.buildDay(this, 130f, 130f).apply(this, dayBox)
                  dayBox.addView(dv)
                  val mv = WidgetUpdater.buildMonth(this, 280f, 250f).apply(this, monthBox)
                  monthBox.addView(mv)
              }

              private fun heading(t: String, size: Float): TextView {
                  val tv = TextView(this)
                  tv.text = t
                  tv.textSize = size
                  tv.setTypeface(null, Typeface.BOLD)
                  tv.setTextColor(0xFF212121.toInt())
                  tv.setPadding(0, dp(18), 0, dp(6))
                  return tv
              }

              private fun note(t: String): TextView {
                  val tv = TextView(this)
                  tv.text = t
                  tv.textSize = 13f
                  tv.setTextColor(0xFF616161.toInt())
                  tv.setPadding(0, 0, 0, dp(10))
                  return tv
              }

              private fun addSeek(
                  parent: LinearLayout, label: String, min: Int, max: Int, value: Int, unit: String,
                  onChange: (Int) -> Unit
              ) {
                  val tv = TextView(this)
                  tv.text = "$label: $value$unit"
                  tv.textSize = 15f
                  tv.setTextColor(0xFF212121.toInt())
                  tv.setPadding(0, dp(8), 0, 0)
                  val sb = SeekBar(this)
                  sb.max = max - min
                  sb.progress = (value - min).coerceIn(0, max - min)
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                          val v = progress + min
                          tv.text = "$label: $v$unit"
                          if (fromUser) onChange(v)
                      }

                      override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                      override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                  })
                  parent.addView(tv)
                  parent.addView(sb, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))
              }

              private fun addCheck(parent: LinearLayout, label: String, checked: Boolean, onChange: (Boolean) -> Unit) {
                  val cb = CheckBox(this)
                  cb.text = label
                  cb.textSize = 15f
                  cb.isChecked = checked
                  cb.setOnCheckedChangeListener { _, b -> onChange(b) }
                  parent.addView(cb)
              }

              private fun swatchDrawable(color: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.shape = GradientDrawable.OVAL
                  g.setColor(color)
                  g.setStroke(dp(2), 0xFF9E9E9E.toInt())
                  return g
              }

              private fun addColor(
                  parent: LinearLayout, label: String, getter: (Settings) -> Int, setter: (Settings, Int) -> Settings
              ) {
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  row.setPadding(0, dp(6), 0, dp(6))
                  val tv = TextView(this)
                  tv.text = label
                  tv.textSize = 15f
                  tv.setTextColor(0xFF212121.toInt())
                  val sw = View(this)
                  sw.background = swatchDrawable(getter(s))
                  row.addView(tv, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  row.addView(sw, LinearLayout.LayoutParams(dp(40), dp(40)))
                  row.setOnClickListener {
                      pickColor(label, getter(s)) { c ->
                          update(setter(s, c))
                          sw.background = swatchDrawable(c)
                      }
                  }
                  parent.addView(row, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))
              }

              private fun pickColor(title: String, current: Int, onPick: (Int) -> Unit) {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(dp(16), dp(8), dp(16), dp(8))
                  var dialog: AlertDialog? = null

                  var i = 0
                  while (i < presets.size) {
                      val row = LinearLayout(this)
                      row.orientation = LinearLayout.HORIZONTAL
                      row.gravity = Gravity.CENTER
                      for (j in i until minOf(i + 6, presets.size)) {
                          val c = presets[j]
                          val v = View(this)
                          v.background = swatchDrawable(c)
                          v.setOnClickListener {
                              onPick(c)
                              dialog?.dismiss()
                          }
                          val lp = LinearLayout.LayoutParams(dp(40), dp(40))
                          lp.setMargins(dp(4), dp(4), dp(4), dp(4))
                          row.addView(v, lp)
                      }
                      box.addView(row)
                      i += 6
                  }

                  val hex = EditText(this)
                  hex.hint = "Mã màu, ví dụ #FF5722"
                  hex.setText(String.format("#%06X", current and 0xFFFFFF))
                  hex.inputType = InputType.TYPE_CLASS_TEXT
                  box.addView(hex)

                  val dlg = AlertDialog.Builder(this)
                      .setTitle(title)
                      .setView(box)
                      .setPositiveButton("Áp dụng") { _, _ ->
                          try {
                              val c = Color.parseColor(hex.text.toString().trim()) or 0xFF000000.toInt()
                              onPick(c)
                          } catch (e: IllegalArgumentException) {
                              // mã màu sai: bỏ qua
                          }
                      }
                      .setNegativeButton("Hủy", null)
                      .create()
                  dialog = dlg
                  dlg.show()
              }
          }
